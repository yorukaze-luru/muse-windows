<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Muse 起動中</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
    background: #ffffff; color: #1a1a1a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; user-select: none;
  }
  .logo { font-size: 44px; font-weight: 600; letter-spacing: 0.02em; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 4px solid #e3e3e3; border-top-color: #6b5ce7;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size: 15px; color: #444; }
  .note { font-size: 11px; color: #999; position: absolute; bottom: 18px; }
  @media (prefers-color-scheme: dark) {
    body { background: #1e1e1e; color: #f0f0f0; }
    .msg { color: #bbb; }
    .spinner { border-color: #3a3a3a; border-top-color: #9d8fff; }
  }
</style>
</head>
<body>
  <div class="logo">Muse</div>
  <div class="spinner"></div>
  <div class="msg">起動中… muse.ai に接続しています</div>
  <div class="note">非公式Windows版ラッパー（個人利用）</div>
</body>
</html>
