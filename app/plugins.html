<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>プラグイン管理</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", "Yu Gothic UI", sans-serif; margin: 0; color: #1c1c1e; background: #f7f7f8; }
  header { padding: 22px 28px 6px; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  p.sub { color: #666; font-size: 13px; margin: 0; line-height: 1.6; }
  p.sub code { background: #ececf0; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  main { padding: 16px 28px 28px; display: flex; flex-direction: column; gap: 14px; }
  .card { display: flex; gap: 16px; background: #fff; border: 1px solid #e2e2e6; border-radius: 12px; padding: 18px; }
  .icon { flex: 0 0 56px; width: 56px; height: 56px; border-radius: 12px; background: #eef3fe; display: flex; align-items: center; justify-content: center; }
  .body { flex: 1; min-width: 0; }
  .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .name { font-size: 16px; font-weight: 700; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .badge.run { background: #e2f4e6; color: #0a7d2c; }
  .badge.stop { background: #eee; color: #555; }
  .badge.none { background: #fde8e8; color: #b00020; }
  .badge.upd { background: #fff3d6; color: #8a6100; }
  .badge.legacy { background: #e8e4f8; color: #4b3a9e; }
  .desc { font-size: 13px; color: #444; line-height: 1.6; margin: 6px 0 2px; }
  .meta { font-size: 12px; color: #888; margin: 2px 0 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button { border: 0; border-radius: 8px; padding: 8px 15px; font-size: 13px; cursor: pointer; background: #2f6fed; color: #fff; }
  button.sub2 { background: #eee; color: #222; }
  button.danger { background: #b00020; }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg { font-size: 12.5px; color: #555; margin-top: 10px; min-height: 1.2em; }
  .empty { color: #777; font-size: 13px; padding: 8px 2px; }
</style>
</head>
<body>
<header>
  <h1>プラグイン</h1>
  <p class="sub">Muse 本体アプリに追加できるプラグインを管理します。アプリの実行フォルダにある <code>plugins</code> フォルダにプラグインのフォルダを入れると、ここに一覧で出てきます。<button class="sub2" id="openFolder" style="padding:4px 10px; font-size:12px; margin-left:6px;">plugins フォルダを開く</button></p>
</header>
<main id="list"></main>
<script>
  const $ = (id) => document.getElementById(id);
  const busy = {};   // id -> true while an action runs
  const msgs = {};   // id -> message text
  let lastData = null;

  function btn(label, cls, onclick) {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.onclick = onclick;
    return b;
  }

  function errText(r) {
    if (r && r.mode === 'gui-launched') return 'アンインストーラーを開きました。画面の指示に従ってください。';
    if (r && r.reason === 'no-release') return '配布元のフィードを取得できませんでした（未公開かオフライン）。';
    if (r && r.reason === 'download-failed') return 'ダウンロードに失敗しました。通信環境を確認してもう一度試してください。';
    if (r && r.reason === 'extract-failed') return 'ダウンロードしたファイルの解凍に失敗しました。もう一度試してください。';
    if (r && r.reason === 'no-uninstaller') return 'アンインストーラーが見つかりませんでした。Windows の設定から削除してください。';
    if (r && r.reason === 'delete-failed') return 'フォルダを削除できませんでした。プラグインを停止してからもう一度試してください。';
    return 'うまくいきませんでした。もう一度試してください。';
  }

  async function act(id, fn, doneMsg) {
    busy[id] = true;
    render(lastData);
    const r = await fn();
    busy[id] = false;
    msgs[id] = (r && r.ok) ? (doneMsg || '') : errText(r);
    refresh();
  }

  function card(p) {
    const root = document.createElement('div');
    root.className = 'card';
    const isBusy = !!busy[p.id];
    const downloading = p.downloadPercent !== null && p.downloadPercent !== undefined;

    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2f6fed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
    root.appendChild(icon);

    const body = document.createElement('div');
    body.className = 'body';
    const row = document.createElement('div');
    row.className = 'title-row';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = p.name;
    row.appendChild(name);
    const badge = document.createElement('span');
    if (p.source === 'catalog') { badge.className = 'badge none'; badge.textContent = '未インストール'; }
    else if (p.running) { badge.className = 'badge run'; badge.textContent = '稼働中'; }
    else { badge.className = 'badge stop'; badge.textContent = '停止中'; }
    row.appendChild(badge);
    if (p.source === 'legacy') {
      const b2 = document.createElement('span');
      b2.className = 'badge legacy';
      b2.textContent = '旧形式（インストール版）';
      row.appendChild(b2);
    }
    if (p.updateAvailable) {
      const b3 = document.createElement('span');
      b3.className = 'badge upd';
      b3.textContent = 'アップデートあり';
      row.appendChild(b3);
    }
    body.appendChild(row);

    if (p.description) {
      const d = document.createElement('p');
      d.className = 'desc';
      d.textContent = p.description;
      body.appendChild(d);
    }
    const meta = document.createElement('p');
    meta.className = 'meta';
    if (p.source === 'catalog') {
      meta.textContent = p.latestVersion ? ('最新版: v' + p.latestVersion + '（GitHub Releases）') : '最新版の情報を取得できませんでした（リリース未公開かオフライン）';
    } else {
      let t = 'バージョン: v' + (p.version || '不明');
      if (p.latestVersion) t += ' / 最新: v' + p.latestVersion;
      if (p.source === 'folder') t += '（plugins フォルダ）';
      meta.textContent = t;
    }
    body.appendChild(meta);

    const actions = document.createElement('div');
    actions.className = 'actions';
    const addBtn = (label, cls, fn, doneMsg) => {
      const b = btn(label, cls, () => act(p.id, fn, doneMsg));
      b.disabled = isBusy || downloading;
      actions.appendChild(b);
    };
    if (p.source === 'catalog') {
      if (p.latestVersion) {
        addBtn(downloading ? ('ダウンロード中… ' + p.downloadPercent + '%') : (isBusy ? 'インストール中…' : 'インストール'), '', () => window.plugins.install(p.id), 'インストールしました');
      }
    } else {
      if (p.updateAvailable || p.source === 'legacy') {
        const label = downloading ? ('ダウンロード中… ' + p.downloadPercent + '%') : (isBusy ? '処理中…' : (p.source === 'legacy' ? 'フォルダ版を入れる' : ('v' + p.latestVersion + ' にアップデート')));
        addBtn(label, '', () => window.plugins.update(p.id), p.source === 'legacy' ? 'フォルダ版を入れました。旧形式は不要ならアンインストールしてください' : 'アップデートしました');
      }
      if (p.running) {
        addBtn('開く', 'sub2', () => window.plugins.open(p.id), '');
        addBtn('停止', 'sub2', () => window.plugins.stop(p.id), '停止しました');
      } else {
        addBtn('起動', '', () => window.plugins.start(p.id), '起動しました');
        addBtn('開く', 'sub2', () => window.plugins.open(p.id), '');
      }
      const un = btn('アンインストール', 'danger', () => {
        if (!confirm(p.name + ' をアンインストールしますか？' + (p.source === 'folder' ? '（plugins フォルダから削除されます）' : ''))) return;
        act(p.id, () => window.plugins.uninstall(p.id), 'アンインストールしました');
      });
      un.disabled = isBusy || downloading;
      actions.appendChild(un);
    }
    body.appendChild(actions);

    const msg = document.createElement('p');
    msg.className = 'msg';
    msg.textContent = msgs[p.id] || '';
    body.appendChild(msg);

    root.appendChild(body);
    return root;
  }

  function render(data) {
    if (!data) return;
    lastData = data;
    const list = $('list');
    list.innerHTML = '';
    if (!data.plugins.length) {
      const e = document.createElement('p');
      e.className = 'empty';
      e.textContent = 'プラグインがありません。';
      list.appendChild(e);
      return;
    }
    for (const p of data.plugins) list.appendChild(card(p));
  }

  async function refresh() {
    const data = await window.plugins.list();
    render(data);
  }
  $('openFolder').onclick = () => window.plugins.openFolder();
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
