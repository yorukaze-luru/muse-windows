<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>プラグイン管理</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", "Yu Gothic UI", sans-serif; margin: 0; color: #1c1c1e; background: #f7f7f8; }
  header { padding: 22px 28px 6px; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  p.sub { color: #666; font-size: 13px; margin: 0; }
  main { padding: 16px 28px 28px; }
  .card { display: flex; gap: 16px; background: #fff; border: 1px solid #e2e2e6; border-radius: 12px; padding: 18px; }
  .icon { flex: 0 0 56px; width: 56px; height: 56px; border-radius: 12px; background: #eef3fe; display: flex; align-items: center; justify-content: center; }
  .body { flex: 1; min-width: 0; }
  .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .name { font-size: 16px; font-weight: 700; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .badge.run { background: #e2f4e6; color: #0a7d2c; }
  .badge.stop { background: #eee; color: #555; }
  .badge.none { background: #fde8e8; color: #b00020; }
  .badge.upd { background: #fff3d6; color: #8a6100; }
  .desc { font-size: 13px; color: #444; line-height: 1.6; margin: 6px 0 2px; }
  .meta { font-size: 12px; color: #888; margin: 2px 0 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button { border: 0; border-radius: 8px; padding: 8px 15px; font-size: 13px; cursor: pointer; background: #2f6fed; color: #fff; }
  button.sub2 { background: #eee; color: #222; }
  button.danger { background: #b00020; }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg { font-size: 12.5px; color: #555; margin-top: 10px; min-height: 1.2em; }
</style>
</head>
<body>
<header>
  <h1>プラグイン</h1>
  <p class="sub">Muse 本体アプリに追加できるプラグインを管理します。配布とアップデートは GitHub Releases 経由です。</p>
</header>
<main>
  <div class="card">
    <div class="icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2f6fed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    </div>
    <div class="body">
      <div class="title-row">
        <span class="name">Muse Link</span>
        <span id="badge" class="badge none">読み込み中</span>
        <span id="updBadge" class="badge upd" style="display:none;">アップデートあり</span>
      </div>
      <p class="desc">Muse があなたのPCのフォルダで作業できるようにする連携エージェントです。別のアプリとしてインストールされ、本体アプリの起動中だけ動作します（本体を終了するとエージェントも終了します）。接続の土台（SSH / Tailscale）は Windows のサービスなので、エージェント停止中も接続自体は切れません。</p>
      <p class="meta" id="meta"></p>
      <div class="actions" id="actions"></div>
      <p class="msg" id="msg"></p>
    </div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let busy = false;
  let lastState = null;

  function btn(label, cls, onclick) {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.disabled = busy;
    b.onclick = onclick;
    return b;
  }

  async function act(fn, doneMsg) {
    busy = true;
    render(lastState);
    const r = await fn();
    busy = false;
    if (r && r.ok) { $('msg').textContent = doneMsg || ''; }
    else if (r && r.mode === 'gui-launched') { $('msg').textContent = 'インストーラーを開きました。画面の指示に従ってください。'; }
    else if (r && r.reason === 'no-release') { $('msg').textContent = 'GitHub Releases に Link の配布がまだありません。'; }
    else if (r && r.reason === 'download-failed') { $('msg').textContent = 'ダウンロードに失敗しました。通信環境を確認してもう一度試してください。'; }
    else { $('msg').textContent = 'うまくいきませんでした。もう一度試してください。'; }
    refresh();
  }

  function render(st) {
    if (!st) return;
    lastState = st;
    const badge = $('badge');
    const actions = $('actions');
    actions.innerHTML = '';
    $('updBadge').style.display = st.updateAvailable ? '' : 'none';
    const downloading = st.downloadPercent !== null && st.downloadPercent !== undefined;
    if (!st.installed) {
      badge.className = 'badge none';
      badge.textContent = '未インストール';
      $('meta').textContent = st.latestVersion
        ? ('最新版: v' + st.latestVersion + '（GitHub Releases）')
        : '最新版の情報を取得できませんでした（リリース未公開かオフライン）';
      if (st.latestVersion) {
        const label = downloading ? ('ダウンロード中… ' + st.downloadPercent + '%') : (busy ? 'インストール中…' : 'インストール');
        const b = btn(label, '', () => {
          $('msg').textContent = 'GitHub Releases からダウンロードしてインストールします…';
          act(() => window.plugins.installLink(), 'インストールしました');
        });
        b.disabled = busy || downloading;
        actions.appendChild(b);
      }
    } else {
      badge.className = 'badge ' + (st.running ? 'run' : 'stop');
      badge.textContent = st.running ? '稼働中' : '停止中';
      let meta = 'インストール済み: v' + (st.installedVersion || '不明');
      if (st.latestVersion) meta += ' / 最新: v' + st.latestVersion;
      $('meta').textContent = meta;
      if (st.updateAvailable) {
        const label = downloading ? ('ダウンロード中… ' + st.downloadPercent + '%') : (busy ? 'アップデート中…' : ('v' + st.latestVersion + ' にアップデート'));
        const b = btn(label, '', () => {
          $('msg').textContent = 'アップデートをダウンロードして適用します…';
          act(() => window.plugins.updateLink(), 'アップデートしました');
        });
        b.disabled = busy || downloading;
        actions.appendChild(b);
      }
      if (st.running) {
        actions.appendChild(btn('エージェントを開く', 'sub2', () => act(() => window.plugins.openLinkWindow(), '')));
        actions.appendChild(btn('停止', 'sub2', () => act(() => window.plugins.stopLink(), '停止しました')));
      } else {
        actions.appendChild(btn('起動', '', () => act(() => window.plugins.startLink(), '起動しました')));
        actions.appendChild(btn('エージェントを開く', 'sub2', () => act(() => window.plugins.openLinkWindow(), '')));
      }
      actions.appendChild(btn('アンインストール', 'danger', () => {
        if (!confirm('Muse Link をアンインストールしますか？')) return;
        act(() => window.plugins.uninstallLink(), 'アンインストールしました');
      }));
    }
  }

  async function refresh() {
    const st = await window.plugins.getLinkState();
    render(st);
  }
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
