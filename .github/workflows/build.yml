name: Build Muse Windows (installer)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Force a release run (normally automatic when the version is ahead of the latest release)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore package-lock.json from base64 chunks
        working-directory: app
        shell: pwsh
        run: |
          $b64 = (Get-ChildItem 'package-lock.b64.part*' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('package-lock.json', [Convert]::FromBase64String($b64))

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ inputs.release }}
        run: ./scripts/release.ps1
