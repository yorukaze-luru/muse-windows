name: Build Muse Windows (installer)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore package-lock.json from base64 chunks
        working-directory: app
        shell: pwsh
        run: |
          $b64 = (Get-ChildItem 'package-lock.b64.part*' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('package-lock.json', [Convert]::FromBase64String($b64))

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Restore icons from base64
        working-directory: app
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('assets/icon.ico', [Convert]::FromBase64String((Get-Content 'assets/icon.ico.b64' -Raw)))
          [IO.File]::WriteAllBytes('assets/icon.png', [Convert]::FromBase64String((Get-Content 'assets/icon.png.b64' -Raw)))

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build app installers and publish draft release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Build app installers (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: app
        run: npx electron-builder --win --publish never

      - name: Upload app installer artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-installer
          path: |
            app/dist/*.exe
            app/dist/latest.yml
          if-no-files-found: ignore
